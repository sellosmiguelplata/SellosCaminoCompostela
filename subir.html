<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sube tu foto</title>
  <style>
    body { background-color: #161a22; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
    h1 { color: #d8b25f; }
    .boton { background-color: #2f9e6b; color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 15px; margin-top: 30px; cursor: pointer; }
    #mensaje { margin-top: 20px; font-size: 18px; color: #9aa4b8; font-weight: bold; }
    #miniatura { max-width: 250px; border-radius: 15px; margin-top: 20px; border: 3px solid #d8b25f; display: none; }
  </style>
</head>
<body>

  <h1>Sello del Peregrino</h1>
  <p>Selecciona la foto desde tu galería personal.</p>

  <input type="file" id="selectorFoto" accept="image/*" style="display: none;">
  <button class="boton" onclick="document.getElementById('selectorFoto').click()">📸 Elegir Foto</button>

  <br><img id="miniatura">
  <p id="mensaje"></p>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const idSesion = parametros.get('sesion') || 'sesion_prueba';
    const URL_MAKE = "https://hook.eu1.make.com/5k5pbmm8hm86kd02veu5gv4xo581jiy9"; // Tu webhook de subida

    document.getElementById('selectorFoto').addEventListener('change', function(evento) {
      const archivo = evento.target.files[0];
      if (!archivo) return;

      document.getElementById('mensaje').innerText = "Optimizando y enviando foto...";
      document.getElementById('mensaje').style.color = "#d8b25f";

      const lector = new FileReader();
      lector.onload = function(e) {
        
        // Crear una imagen temporal para comprimirla
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; // Reducimos el tamaño a 800px para que pese muy poco
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // Extraemos la imagen comprimida (JPEG al 80% de calidad)
          const fotoComprimida = canvas.toDataURL('image/jpeg', 0.8);

          document.getElementById('miniatura').src = fotoComprimida;
          document.getElementById('miniatura').style.display = 'inline-block';
          
          fetch(URL_MAKE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sesion: idSesion, imagen: fotoComprimida })
          })
          .then(respuesta => {
            document.getElementById('mensaje').innerText = "✅ ¡Foto enviada! Ya puedes mirar la pantalla de la tablet.";
            document.getElementById('mensaje').style.color = "#2f9e6b";
          })
          .catch(error => {
            document.getElementById('mensaje').innerText = "❌ Hubo un error al enviar. Revisa tu internet.";
            document.getElementById('mensaje').style.color = "#d0534a";
          });
        };
        img.src = e.target.result;
      };
      lector.readAsDataURL(archivo);
    });
  </script>

</body>
</html>
