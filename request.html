<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StampMyFace — Order Your Stamp</title>
  <style>
    body {
      background-color: #161a22;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 35px 20px;
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
    }
    .lang-bar {
      margin-bottom: 20px;
    }
    .lang-btn {
      background: #232936;
      color: #9aa4b8;
      border: 1px solid #323a4b;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin: 0 3px;
    }
    .lang-btn.active {
      border-color: #d8b25f;
      color: #d8b25f;
      font-weight: bold;
    }
    h1 {
      color: #d8b25f;
      margin-bottom: 8px;
      font-size: 28px;
    }
    #subtitulo {
      color: #b8c1d1;
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 25px;
    }
    .campo-grupo {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #d8b25f;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 17px;
      border-radius: 12px;
      border: 2px solid #323a4b;
      background-color: #232936;
      color: white;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #d8b25f;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .opt-btn {
      background: #232936;
      color: #e2e8f0;
      border: 2px solid #323a4b;
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    .opt-btn.sel {
      border-color: #d8b25f;
      background: #2e3647;
      color: #d8b25f;
      box-shadow: 0 0 0 2px rgba(216, 178, 95, 0.25);
    }
    .color-btn {
      height: 42px;
      border-radius: 10px;
      border: 2px solid #323a4b;
      cursor: pointer;
      transition: 0.15s;
    }
    .color-btn.sel {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px #d8b25f;
      transform: scale(1.04);
    }
    .boton {
      width: 100%;
      background-color: #2f9e6b;
      color: white;
      border: none;
      padding: 18px 25px;
      font-size: 19px;
      font-weight: bold;
      border-radius: 14px;
      margin-top: 10px;
      cursor: pointer;
    }
    .boton-enviar {
      background-color: #d8b25f;
      color: #161a22;
      margin-top: 20px;
    }
    #estadoFoto {
      margin-top: 14px;
      font-size: 15px;
      color: #2f9e6b;
      font-weight: bold;
      display: none;
    }
    #mensaje {
      margin-top: 22px;
      font-size: 17px;
      line-height: 1.4;
      font-weight: bold;
    }
    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('en', this)">EN</button>
      <button class="lang-btn" onclick="setLang('es', this)">ES</button>
      <button class="lang-btn" onclick="setLang('de', this)">DE</button>
      <button class="lang-btn" onclick="setLang('fr', this)">FR</button>
    </div>

    <h1 id="tituloPrincipal">Order Your Portrait Stamp</h1>
    <p id="subtitulo">Enter your name, pick your crest style and ink color, and upload your photo.</p>

    <div id="formulario">
      <div class="campo-grupo">
        <label id="lblNombre" for="nombreCliente">Your Name (for pickup)</label>
        <input type="text" id="nombreCliente" placeholder="e.g. Alex" maxlength="35" required>
      </div>

      <div class="campo-grupo">
        <label id="lblEstilo">Crest Style</label>
        <div class="grid-4" id="estiloGroup">
          <button type="button" class="opt-btn sel" data-estilo="marco1.jpg" onclick="setEstilo('marco1.jpg', this)"><span class="estilo-txt">Style 1</span></button>
          <button type="button" class="opt-btn" data-estilo="marco2.jpg" onclick="setEstilo('marco2.jpg', this)"><span class="estilo-txt">Style 2</span></button>
          <button type="button" class="opt-btn" data-estilo="marco3.jpg" onclick="setEstilo('marco3.jpg', this)"><span class="estilo-txt">Style 3</span></button>
          <button type="button" class="opt-btn" data-estilo="marco4.jpg" onclick="setEstilo('marco4.jpg', this)"><span class="estilo-txt">Style 4</span></button>
        </div>
      </div>

      <div class="campo-grupo">
        <label id="lblColor">Ink Color</label>
        <div class="grid-4" id="colorGroup">
          <button type="button" class="color-btn sel" data-color="8a2222" style="background:#8a2222;" onclick="setColor('8a2222', this)" title="Burgundy"></button>
          <button type="button" class="color-btn" data-color="1e3a8a" style="background:#1e3a8a;" onclick="setColor('1e3a8a', this)" title="Navy"></button>
          <button type="button" class="color-btn" data-color="065f46" style="background:#065f46;" onclick="setColor('065f46', this)" title="Green"></button>
          <button type="button" class="color-btn" data-color="111827" style="background:#111827;" onclick="setColor('111827', this)" title="Black"></button>
        </div>
      </div>

      <input type="file" id="selectorFoto" accept="image/*" style="display: none;">
      <button type="button" class="boton" id="btnElegir" onclick="document.getElementById('selectorFoto').click()">📸 1. Choose Photo</button>

      <p id="estadoFoto"></p>

      <button type="button" class="boton boton-enviar oculto" id="btnEnviar" onclick="enviarPedido()">🚀 2. Send to Queue</button>
    </div>

    <p id="mensaje"></p>
  </div>

  <script>
    const URL_MAKE_QUEUE = "https://hook.eu1.make.com/phiridpll24la7dvtru2ezv45fkvxc5p";

    let blobFotoCruda = null;
    let idiomaActual = 'en';
    let estiloActual = 'marco1.jpg';
    let colorActual = '8a2222';

    const textos = {
      en: {
        main: "Order Your Portrait Stamp",
        sub: "Enter your name, pick your crest style and ink color, and upload your photo.",
        lbl: "Your Name (for pickup)",
        ph: "e.g. Alex",
        lblEstilo: "Crest Style",
        styleWord: "Style",
        lblColor: "Ink Color",
        btnChoose: "📸 1. Choose Photo",
        btnChange: "🔄 Change Photo",
        btnSend: "🚀 2. Send to Queue",
        ready: "✓ Photo ready to send",
        noName: "⚠️ Please enter your name first.",
        sending: "⏳ Sending your photo...",
        ok: "✅ Photo received! Grab a coffee — we are preparing your stamp.",
        err: "❌ Connection error. Please check your internet and try again."
      },
      es: {
        main: "Pide tu Sello Retrato",
        sub: "Escribe tu nombre, elige el estilo del escudo y el color, y sube tu foto.",
        lbl: "Tu Nombre (para recogerlo)",
        ph: "ej. Alex",
        lblEstilo: "Estilo del escudo",
        styleWord: "Estilo",
        lblColor: "Color de tinta",
        btnChoose: "📸 1. Elegir Foto",
        btnChange: "🔄 Cambiar Foto",
        btnSend: "🚀 2. Enviar Pedido",
        ready: "✓ Foto lista para enviar",
        noName: "⚠️ Por favor, escribe tu nombre primero.",
        sending: "⏳ Enviando tu foto...",
        ok: "✅ ¡Foto recibida! Ve a tomar un café, estamos preparando tu sello.",
        err: "❌ Error de conexión. Revisa tu internet e inténtalo de nuevo."
      },
      de: {
        main: "Porträtstempel bestellen",
        sub: "Gib deinen Namen ein, wähle Wappenstil und Farbe und lade dein Foto hoch.",
        lbl: "Dein Name (zur Abholung)",
        ph: "z. B. Alex",
        lblEstilo: "Wappenstil",
        styleWord: "Stil",
        lblColor: "Tintenfarbe",
        btnChoose: "📸 1. Foto auswählen",
        btnChange: "🔄 Foto ändern",
        btnSend: "🚀 2. Bestellung senden",
        ready: "✓ Foto bereit zum Senden",
        noName: "⚠️ Bitte gib zuerst deinen Namen ein.",
        sending: "⏳ Foto wird gesendet...",
        ok: "✅ Foto erhalten! Genieß deinen Kaffee – dein Stempel wird vorbereitet.",
        err: "❌ Verbindungsfehler. Bitte prüfe dein Internet."
      },
      fr: {
        main: "Commandez votre Tampon",
        sub: "Entrez votre nom, choisissez le style et la couleur, puis envoyez votre photo.",
        lbl: "Votre Nom (pour le retrait)",
        ph: "ex. Alex",
        lblEstilo: "Style d'écusson",
        styleWord: "Style",
        lblColor: "Couleur d'encre",
        btnChoose: "📸 1. Choisir une photo",
        btnChange: "🔄 Changer la photo",
        btnSend: "🚀 2. Envoyer la commande",
        ready: "✓ Photo prête à être envoyée",
        noName: "⚠️ Veuillez d'abord entrer votre nom.",
        sending: "⏳ Envoi de votre photo...",
        ok: "✅ Photo reçue ! Prenez un café, nous préparons votre tampon.",
        err: "❌ Erreur de connexion. Vérifiez votre internet."
      }
    };

    function setEstilo(estilo, btn) {
      estiloActual = estilo;
      document.querySelectorAll('#estiloGroup .opt-btn').forEach(b => b.classList.remove('sel'));
      if (btn) btn.classList.add('sel');
    }

    function setColor(colorHex, btn) {
      colorActual = colorHex;
      document.querySelectorAll('#colorGroup .color-btn').forEach(b => b.classList.remove('sel'));
      if (btn) btn.classList.add('sel');
    }

    function setLang(lang, btn) {
      idiomaActual = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const t = textos[lang];
      document.getElementById('tituloPrincipal').innerText = t.main;
      document.getElementById('subtitulo').innerText = t.sub;
      document.getElementById('lblNombre').innerText = t.lbl;
      document.getElementById('nombreCliente').placeholder = t.ph;
      document.getElementById('lblEstilo').innerText = t.lblEstilo;
      document.getElementById('lblColor').innerText = t.lblColor;
      document.querySelectorAll('#estiloGroup .estilo-txt').forEach((el, idx) => {
        el.innerText = `${t.styleWord} ${idx + 1}`;
      });
      document.getElementById('btnElegir').innerText = blobFotoCruda ? t.btnChange : t.btnChoose;
      document.getElementById('btnEnviar').innerText = t.btnSend;
      if (blobFotoCruda) {
        document.getElementById('estadoFoto').innerText = t.ready;
      }
    }

    document.getElementById('selectorFoto').addEventListener('change', function(evento) {
      const archivo = evento.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIDE = 1024;
          const iw = img.naturalWidth || img.width;
          const ih = img.naturalHeight || img.height;
          const scale = Math.min(1, MAX_SIDE / Math.max(iw, ih));
          canvas.width = Math.round(iw * scale);
          canvas.height = Math.round(ih * scale);

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(function(blob) {
            if (!blob) return;
            blobFotoCruda = blob;

            const estado = document.getElementById('estadoFoto');
            estado.innerText = textos[idiomaActual].ready;
            estado.style.display = 'block';

            document.getElementById('btnElegir').innerText = textos[idiomaActual].btnChange;
            document.getElementById('btnEnviar').classList.remove('oculto');
            document.getElementById('mensaje').innerText = "";
          }, 'image/jpeg', 0.9);
        };
        img.src = e.target.result;
      };
      lector.readAsDataURL(archivo);
    });

    function enviarPedido() {
      const t = textos[idiomaActual];
      const nombre = document.getElementById('nombreCliente').value.trim();

      if (!nombre) {
        document.getElementById('mensaje').innerText = t.noName;
        document.getElementById('mensaje').style.color = "#d8b25f";
        document.getElementById('nombreCliente').focus();
        return;
      }
      if (!blobFotoCruda) return;

      document.getElementById('btnEnviar').classList.add('oculto');
      document.getElementById('btnElegir').classList.add('oculto');
      document.getElementById('mensaje').innerText = t.sending;
      document.getElementById('mensaje').style.color = "#d8b25f";

      const nombreLimpio = nombre.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]/g, '_');
      const formData = new FormData();
      formData.append('nombre', nombre);
      formData.append('archivo_nombre', nombreLimpio + '.jpg');
      formData.append('estilo', estiloActual);
      formData.append('color', colorActual);
      formData.append('idioma', idiomaActual);
      formData.append('foto', blobFotoCruda, nombreLimpio + '.jpg');

      fetch(URL_MAKE_QUEUE, {
        method: 'POST',
        body: formData
      })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        document.getElementById('formulario').classList.add('oculto');
        document.getElementById('mensaje').innerText = t.ok;
        document.getElementById('mensaje').style.color = "#2f9e6b";
      })
      .catch(err => {
        document.getElementById('mensaje').innerText = t.err;
        document.getElementById('mensaje').style.color = "#d0534a";
        document.getElementById('btnEnviar').classList.remove('oculto');
        document.getElementById('btnElegir').classList.remove('oculto');
      });
    }
  </script>

</body>
</html>
