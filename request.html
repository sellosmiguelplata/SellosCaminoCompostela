<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StampMyFace — Order Your Stamp</title>
  <style>
    body {
      background-color: #161a22;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 35px 20px;
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
    }
    .lang-bar {
      margin-bottom: 20px;
    }
    .lang-btn {
      background: #232936;
      color: #9aa4b8;
      border: 1px solid #323a4b;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin: 0 3px;
    }
    .lang-btn.active {
      border-color: #d8b25f;
      color: #d8b25f;
      font-weight: bold;
    }
    h1 {
      color: #d8b25f;
      margin-bottom: 8px;
      font-size: 28px;
    }
    #subtitulo {
      color: #b8c1d1;
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 25px;
    }
    .campo-grupo {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #d8b25f;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 17px;
      border-radius: 12px;
      border: 2px solid #323a4b;
      background-color: #232936;
      color: white;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #d8b25f;
    }
    .boton {
      width: 100%;
      background-color: #2f9e6b;
      color: white;
      border: none;
      padding: 18px 25px;
      font-size: 19px;
      font-weight: bold;
      border-radius: 14px;
      margin-top: 10px;
      cursor: pointer;
    }
    .boton-enviar {
      background-color: #d8b25f;
      color: #161a22;
      margin-top: 20px;
    }
    #miniatura {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      margin-top: 20px;
      border: 3px solid #d8b25f;
      display: none;
      background: #fff;
    }
    #mensaje {
      margin-top: 22px;
      font-size: 17px;
      line-height: 1.4;
      font-weight: bold;
    }
    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('en', this)">EN</button>
      <button class="lang-btn" onclick="setLang('es', this)">ES</button>
      <button class="lang-btn" onclick="setLang('de', this)">DE</button>
      <button class="lang-btn" onclick="setLang('fr', this)">FR</button>
    </div>

    <h1 id="tituloPrincipal">Order Your Portrait Stamp</h1>
    <p id="subtitulo">Enter your name and upload your photo. Grab a coffee while we prepare your stamp!</p>

    <div id="formulario">
      <div class="campo-grupo">
        <label id="lblNombre" for="nombreCliente">Your Name (for pickup)</label>
        <input type="text" id="nombreCliente" placeholder="e.g. Alex" maxlength="35" required>
      </div>

      <input type="file" id="selectorFoto" accept="image/*" style="display: none;">
      <button type="button" class="boton" id="btnElegir" onclick="document.getElementById('selectorFoto').click()">📸 1. Choose Photo</button>

      <br><canvas id="miniatura" width="600" height="600"></canvas>

      <button type="button" class="boton boton-enviar oculto" id="btnEnviar" onclick="enviarPedido()">🚀 2. Send to Queue</button>
    </div>

    <p id="mensaje"></p>
  </div>

  <script>
    const URL_MAKE_QUEUE = "https://hook.eu1.make.com/phiridpll24la7dvtru2ezv45fkvxc5p";
    const INK_HEX = "#8a2222";
    const THRESHOLD = 110;
    const FRAME_FILE = "marco1.jpg";

    let blobSelloLista = null;
    let idiomaActual = 'en';
    let frameImg = null;

    const marcoTemp = new Image();
    marcoTemp.crossOrigin = "anonymous";
    marcoTemp.onload = () => { frameImg = marcoTemp; };
    marcoTemp.src = FRAME_FILE;

    const textos = {
      en: {
        main: "Order Your Portrait Stamp",
        sub: "Enter your name and upload your photo. Grab a coffee while we prepare your stamp!",
        lbl: "Your Name (for pickup)",
        ph: "e.g. Alex",
        btnChoose: "📸 1. Choose Photo",
        btnChange: "🔄 Change Photo",
        btnSend: "🚀 2. Send to Queue",
        noName: "⚠️ Please enter your name first.",
        sending: "⏳ Sending your stamp...",
        ok: "✅ Stamp sent! Go enjoy your coffee — it will be ready soon.",
        err: "❌ Connection error. Please check your internet and try again."
      },
      es: {
        main: "Pide tu Sello Retrato",
        sub: "Escribe tu nombre y sube tu foto. ¡Ve a tomar un café mientras preparamos tu sello!",
        lbl: "Tu Nombre (para recogerlo)",
        ph: "ej. Alex",
        btnChoose: "📸 1. Elegir Foto",
        btnChange: "🔄 Cambiar Foto",
        btnSend: "🚀 2. Enviar Pedido",
        noName: "⚠️ Por favor, escribe tu nombre primero.",
        sending: "⏳ Enviando tu sello...",
        ok: "✅ ¡Sello enviado! Ve a disfrutar de tu café, enseguida estará listo.",
        err: "❌ Error de conexión. Revisa tu internet e inténtalo de nuevo."
      },
      de: {
        main: "Porträtstempel bestellen",
        sub: "Gib deinen Namen ein und lade dein Foto hoch. Gönn dir einen Kaffee, wir bereiten alles vor!",
        lbl: "Dein Name (zur Abholung)",
        ph: "z. B. Alex",
        btnChoose: "📸 1. Foto auswählen",
        btnChange: "🔄 Foto ändern",
        btnSend: "🚀 2. Bestellung senden",
        noName: "⚠️ Bitte gib zuerst deinen Namen ein.",
        sending: "⏳ Dein Stempel wird gesendet...",
        ok: "✅ Stempel gesendet! Genieß deinen Kaffee – er ist gleich fertig.",
        err: "❌ Verbindungsfehler. Bitte prüfe dein Internet."
      },
      fr: {
        main: "Commandez votre Tampon",
        sub: "Entrez votre nom et envoyez votre photo. Prenez un café pendant que nous préparons votre tampon !",
        lbl: "Votre Nom (pour le retrait)",
        ph: "ex. Alex",
        btnChoose: "📸 1. Choisir une photo",
        btnChange: "🔄 Changer la photo",
        btnSend: "🚀 2. Envoyer la commande",
        noName: "⚠️ Veuillez d'abord entrer votre nom.",
        sending: "⏳ Envoi de votre tampon...",
        ok: "✅ Tampon envoyé ! Profitez de votre café, il sera bientôt prêt.",
        err: "❌ Erreur de connexion. Vérifiez votre internet."
      }
    };

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }

    function renderStampBlob(img, callback) {
      const size = 600;
      const cx = size / 2;
      const cy = size / 2;
      const R = 170;
      const offsetY = -6;
      const ink = hexToRgb(INK_HEX);

      const outCanvas = document.getElementById('miniatura');
      outCanvas.width = size;
      outCanvas.height = size;
      const ctx = outCanvas.getContext('2d');
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      // Foto recortada en círculo y convertida a tinta
      const temp = document.createElement('canvas');
      temp.width = size;
      temp.height = size;
      const tctx = temp.getContext('2d', { willReadFrequently: true });
      tctx.save();
      tctx.beginPath();
      tctx.arc(cx, cy + offsetY, R, 0, Math.PI * 2);
      tctx.clip();

      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const box = R * 2;
      const sc = Math.max(box / iw, box / ih);
      const dw = iw * sc;
      const dh = ih * sc;
      tctx.drawImage(img, cx - dw / 2, cy + offsetY - dh / 2, dw, dh);
      tctx.restore();

      try {
        const d = tctx.getImageData(0, 0, size, size);
        const px = d.data;
        for (let i = 0; i < px.length; i += 4) {
          const avg = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
          if (avg < THRESHOLD && px[i + 3] > 50) {
            px[i] = ink.r; px[i + 1] = ink.g; px[i + 2] = ink.b; px[i + 3] = 255;
          } else {
            px[i + 3] = 0;
          }
        }
        tctx.putImageData(d, 0, 0);
        ctx.drawImage(temp, 0, 0);
      } catch (e) {
        ctx.drawImage(temp, 0, 0);
      }

      // Marco si está cargado
      if (frameImg) {
        const fCanvas = document.createElement('canvas');
        fCanvas.width = size;
        fCanvas.height = size;
        const fctx = fCanvas.getContext('2d', { willReadFrequently: true });
        fctx.drawImage(frameImg, 0, 0, size, size);
        try {
          const fd = fctx.getImageData(0, 0, size, size);
          const fpx = fd.data;
          for (let i = 0; i < fpx.length; i += 4) {
            const avg = fpx[i] * 0.299 + fpx[i + 1] * 0.587 + fpx[i + 2] * 0.114;
            if (avg < 120 && fpx[i + 3] > 50) {
              fpx[i] = ink.r; fpx[i + 1] = ink.g; fpx[i + 2] = ink.b; fpx[i + 3] = 255;
            } else {
              fpx[i + 3] = 0;
            }
          }
          fctx.putImageData(fd, 0, 0);
          ctx.drawImage(fCanvas, 0, 0);
        } catch (e) {
          ctx.drawImage(frameImg, 0, 0, size, size);
        }
      }

      outCanvas.style.display = 'inline-block';
      outCanvas.toBlob(blob => callback(blob), 'image/jpeg', 0.92);
    }

    function setLang(lang, btn) {
      idiomaActual = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const t = textos[lang];
      document.getElementById('tituloPrincipal').innerText = t.main;
      document.getElementById('subtitulo').innerText = t.sub;
      document.getElementById('lblNombre').innerText = t.lbl;
      document.getElementById('nombreCliente').placeholder = t.ph;
      document.getElementById('btnElegir').innerText = blobSelloLista ? t.btnChange : t.btnChoose;
      document.getElementById('btnEnviar').innerText = t.btnSend;
    }

    document.getElementById('selectorFoto').addEventListener('change', function(evento) {
      const archivo = evento.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          renderStampBlob(img, function(blob) {
            if (!blob) return;
            blobSelloLista = blob;
            document.getElementById('btnElegir').innerText = textos[idiomaActual].btnChange;
            document.getElementById('btnEnviar').classList.remove('oculto');
            document.getElementById('mensaje').innerText = "";
          });
        };
        img.src = e.target.result;
      };
      lector.readAsDataURL(archivo);
    });

    function enviarPedido() {
      const t = textos[idiomaActual];
      const nombre = document.getElementById('nombreCliente').value.trim();

      if (!nombre) {
        document.getElementById('mensaje').innerText = t.noName;
        document.getElementById('mensaje').style.color = "#d8b25f";
        document.getElementById('nombreCliente').focus();
        return;
      }
      if (!blobSelloLista) return;

      document.getElementById('btnEnviar').classList.add('oculto');
      document.getElementById('btnElegir').classList.add('oculto');
      document.getElementById('mensaje').innerText = t.sending;
      document.getElementById('mensaje').style.color = "#d8b25f";

      const nombreLimpio = nombre.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]/g, '_');
      const formData = new FormData();
      formData.append('nombre', nombre);
      formData.append('archivo_nombre', nombreLimpio + '.jpg');
      formData.append('idioma', idiomaActual);
      formData.append('foto', blobSelloLista, nombreLimpio + '.jpg');

      fetch(URL_MAKE_QUEUE, {
        method: 'POST',
        body: formData
      })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        document.getElementById('formulario').classList.add('oculto');
        document.getElementById('mensaje').innerText = t.ok;
        document.getElementById('mensaje').style.color = "#2f9e6b";
      })
      .catch(err => {
        document.getElementById('mensaje').innerText = t.err;
        document.getElementById('mensaje').style.color = "#d0534a";
        document.getElementById('btnEnviar').classList.remove('oculto');
        document.getElementById('btnElegir').classList.remove('oculto');
      });
    }
  </script>

</body>
</html>
